name: Cimmich CI

on:
  workflow_dispatch:
    inputs:
      full_release:
        description: Run Docker migration and full synthetic release acceptance
        required: false
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: cimmich-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-and-release-truth:
    name: Service and release truth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json

      - name: Use Python 3.12 for provider auditing
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release-test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install service dependencies
        working-directory: service
        run: npm ci

      - name: Audit service dependencies
        working-directory: service
        run: npm audit --audit-level=low

      - name: Audit resolved provider dependency graphs
        run: |
          python3 -m venv /tmp/cimmich-pip-audit
          /tmp/cimmich-pip-audit/bin/python -m pip install --disable-pip-version-check --no-cache-dir pip-audit==2.9.0
          for requirements in providers/*/requirements.txt; do
            /tmp/cimmich-pip-audit/bin/pip-audit --cache-dir /tmp/cimmich-pip-audit-cache --requirement "$requirements"
          done

      - name: Check all service JavaScript syntax
        working-directory: service
        run: npm run check:syntax

      - name: Prevent source-file concentration from growing
        run: node tools/check_source_shape.mjs

      - name: Check service formatting
        working-directory: service
        run: npm run format

      - name: Lint service
        working-directory: service
        run: npm run lint

      - name: Run service and release-schema tests
        working-directory: service
        run: npm test

      - name: Verify portable operator syntax
        run: |
          for script in tools/*.sh; do
            sh -n "$script"
          done

      - name: Verify beginner install documentation
        run: tools/run_install_docs_acceptance.sh

  provider-contracts:
    name: Provider contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            providers/opencv-sface/requirements.txt
            providers/perceptual-dhash/requirements.txt

      - name: Install contract-test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            opencv-python-headless==4.11.0.86 \
            Pillow==12.3.0

      - name: Run every provider contract test
        run: tools/run_provider_contract_tests.sh

  web:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install web dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Audit web dependencies
        working-directory: ui
        run: pnpm audit --audit-level=low

      - name: Build local Immich SDK
        working-directory: ui
        run: pnpm --filter @immich/sdk build

      - name: Check formatting
        working-directory: ui/web
        run: pnpm run format

      - name: Lint
        working-directory: ui/web
        env:
          SYNCKIT_TIMEOUT: 120000
        run: pnpm run lint

      - name: Check Svelte
        working-directory: ui/web
        run: pnpm run check:svelte

      - name: Check TypeScript
        working-directory: ui/web
        run: pnpm run check:typescript

      - name: Run web tests
        working-directory: ui/web
        run: pnpm run test:cov -- --run

      - name: Build production web
        working-directory: ui/web
        run: pnpm run build

  browser-journeys:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CIMMICH_E2E_BASE_URL: http://127.0.0.1:3303
      CIMMICH_PUBLIC_DEMO_PROJECT: cimmich-public-demo-ci
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install browser-test dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        working-directory: ui/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Fetch the checksum-pinned fictional demo archive
        env:
          CEDAR_ARCHIVE_SHA256: 937b5859635af6f1b775dcbab1e28411b2e6f4a6182b72e003e3ccdda455347f
          CIMMICH_PUBLIC_DEMO_ARCHIVE_ROOT: ${{ runner.temp }}/cedar-house-v1
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/cimmich-cedar-house-v1.tar.gz" \
            https://github.com/cimmich/cimmich/releases/download/v1.0.0-build-week/cimmich-cedar-house-v1.tar.gz
          printf '%s  %s\n' "$CEDAR_ARCHIVE_SHA256" "$RUNNER_TEMP/cimmich-cedar-house-v1.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/cimmich-cedar-house-v1.tar.gz" -C "$RUNNER_TEMP"
          test "$(find "$CIMMICH_PUBLIC_DEMO_ARCHIVE_ROOT/media" -type f -name '*.png' | wc -l)" -eq 51

      - name: Run all browser journeys against an isolated demo
        env:
          CIMMICH_E2E_STATE_ROOT: ${{ runner.temp }}/cimmich-public-demo-ci
          CIMMICH_PUBLIC_DEMO_ARCHIVE_ROOT: ${{ runner.temp }}/cedar-house-v1
          CIMMICH_PUBLIC_DEMO_STATE_ROOT: ${{ runner.temp }}/cimmich-public-demo-ci
        run: |
          tools/public_demo.sh up
          tools/run_browser_acceptance.sh

      - name: Destroy the isolated demo
        if: always()
        env:
          CIMMICH_PUBLIC_DEMO_STATE_ROOT: ${{ runner.temp }}/cimmich-public-demo-ci
        run: |
          if test -f "$CIMMICH_PUBLIC_DEMO_STATE_ROOT/.cimmich-public-demo"; then
            tools/public_demo.sh destroy "--confirm=$CIMMICH_PUBLIC_DEMO_PROJECT"
          fi

  full-release-lifecycle:
    name: Full release lifecycle
    if: startsWith(github.ref, 'refs/tags/v') || inputs.full_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json

      - name: Install release-test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install service dependencies
        working-directory: service
        run: npm ci

      - name: Prove fresh, concurrent, interrupted and resumed migrations
        run: tools/run_migration_runner_acceptance.sh

      - name: Prove the full disposable synthetic product lifecycle
        run: tools/run_synthetic_acceptance.sh
