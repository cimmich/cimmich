name: Container images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing exact v* tag to publish or rebuild after its CI has passed
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve exact release tag
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      is_release_tag: ${{ steps.release.outputs.is_release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Check out candidate source with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - name: Resolve one exact v* tag at HEAD
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          release_sha=$(git rev-parse HEAD)
          release_tags=$(git tag --points-at HEAD | grep '^v' || true)
          release_tag=$(printf '%s\n' "$release_tags" | awk 'NF { value=$0; count+=1 } END { if (count == 1) print value }')
          if test -n "$REQUESTED_TAG"; then
            test "$REQUESTED_TAG" = "$release_tag" || {
              echo "manual rebuild must name the one exact v* tag at HEAD" >&2
              exit 1
            }
          fi
          if test -n "$release_tag"; then
            printf '%s\n' "$release_tag" | grep -Eq '^v[A-Za-z0-9._-]+$'
            curl --fail --silent --show-error \
              -H "authorization: Bearer $GH_TOKEN" \
              -H 'accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?branch=$release_tag&event=push&status=completed&per_page=100" \
              -o "$RUNNER_TEMP/cimmich-ci-runs.json"
            node -e '
              const fs = require("node:fs");
              const [path, sha, tag] = process.argv.slice(1);
              const runs = JSON.parse(fs.readFileSync(path, "utf8")).workflow_runs || [];
              if (!runs.some((run) => run.name === "Cimmich CI" &&
                run.conclusion === "success" && run.head_sha === sha &&
                run.head_branch === tag)) process.exit(2);
            ' "$RUNNER_TEMP/cimmich-ci-runs.json" "$release_sha" "$release_tag" || {
              echo "exact release tag has no successful Cimmich CI run" >&2
              exit 1
            }
          fi
          {
            printf 'release_sha=%s\n' "$release_sha"
            printf 'release_tag=%s\n' "$release_tag"
            if test -n "$release_tag"; then
              printf 'is_release_tag=true\n'
            else
              printf 'is_release_tag=false\n'
            fi
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    needs: resolve-release
    if: needs.resolve-release.outputs.is_release_tag == 'true'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cimmich-api
            dockerfile: tools/public_demo_api.Dockerfile
            target: production
            build_args: ""
          - image: cimmich-ui
            dockerfile: tools/cimmich_ui.Dockerfile
            target: ""
            build_args: PUBLIC_CIMMICH_API_URL=/cimmich-api
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-release.outputs.release_sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.resolve-release.outputs.release_tag }}
            type=sha,prefix=sha-

      - name: Build and publish image with SBOM and provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          sbom: true
          provenance: mode=max

      - name: Sign GitHub build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
