server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;

  location = /cimmich-api/health {
    proxy_pass http://cimmich-api:3101/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
  }

  location = /_cimmich_owner_session {
    internal;
    proxy_pass http://cimmich-api:3101/_internal/owner-session;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Api-Key $http_x_api_key;
    proxy_set_header Host cimmich-api;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
  }

  location ^~ /cimmich-api/_internal/ {
    return 404;
  }

  location /cimmich-api/ {
    auth_request /_cimmich_owner_session;
    auth_request_set $cimmich_authenticated_principal $upstream_http_x_cimmich_authenticated_principal;
    auth_request_set $cimmich_owner_binding_state $upstream_http_x_cimmich_owner_binding_state;
    proxy_pass http://cimmich-api:3101/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Cimmich-Authenticated-Principal $cimmich_authenticated_principal;
    proxy_set_header X-Cimmich-Owner-Binding-State $cimmich_owner_binding_state;
  }

  location /api {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://immich-server:2283;
  }

  location /.well-known/immich {
    proxy_set_header Host $host;
    proxy_pass http://immich-server:2283;
  }

  location = /custom.css {
    proxy_set_header Host $host;
    proxy_pass http://immich-server:2283;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
