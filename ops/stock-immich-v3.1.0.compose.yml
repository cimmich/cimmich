name: cimmich-stock-lifecycle

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
    volumes:
      - ${IMMICH_UPLOAD_ROOT:?set IMMICH_UPLOAD_ROOT}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich-database
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
    ports:
      - 127.0.0.1:${IMMICH_PORT:-22839}:2283
    depends_on:
      immich-database:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    networks:
      - immich-internal

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
    volumes:
      - ${IMMICH_MODEL_CACHE_ROOT:?set IMMICH_MODEL_CACHE_ROOT}:/cache
    networks:
      - immich-internal

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 60
    networks:
      - immich-internal

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${IMMICH_DB_ROOT:?set IMMICH_DB_ROOT}:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 1s
      timeout: 3s
      retries: 60
    networks:
      - immich-internal

  cimmich-database:
    image: pgvector/pgvector:0.8.2-pg17-trixie@sha256:5c97c57367a485a8e99389548db67d441ab1a878f5492c3df04989f34ecf3c75
    environment:
      POSTGRES_PASSWORD: ${CIMMICH_DB_PASSWORD:?set CIMMICH_DB_PASSWORD}
      POSTGRES_USER: cimmich
      POSTGRES_DB: cimmich
    volumes:
      - ${CIMMICH_DB_ROOT:?set CIMMICH_DB_ROOT}:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${CIMMICH_DB_PORT:-55439}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cimmich -d cimmich"]
      interval: 1s
      timeout: 3s
      retries: 60
    networks:
      - cimmich-internal

networks:
  immich-internal:
    internal: false
  cimmich-internal:
    internal: false
